<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Agent Manager</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  height: 100vh;
  background: #1e1e1e;
  color: #d4d4d4;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  padding: 0;
  overflow: hidden;
}
.header {
  background: #2d2d2d;
  border-bottom: 1px solid #3d3d3d;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.header h1 { font-size: 16px; color: #e0e0e0; }
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid #3d3d3d;
  flex-shrink: 0;
}
.tab {
  padding: 10px 16px;
  background: #2d2d2d;
  color: #888;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  font-size: 13px;
}
.tab:hover { background: #3d3d3d; color: #ccc; }
.tab.active { background: #1e1e1e; color: #e0e0e0; border-bottom-color: #007acc; }
.content {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.panel {
  flex: 1;
  overflow: auto;
  padding: 16px;
  border-right: 1px solid #2d2d2d;
}
.panel:last-child { border-right: none; }
.panel h2 {
  font-size: 15px;
  margin-bottom: 12px;
  color: #ffffff;
}
.agent-card {
  background: #2d2d2d;
  border: 1px solid #3d3d3d;
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 12px;
}
.agent-card h3 { font-size: 14px; color: #e0e0e0; margin-bottom: 4px; }
.agent-card p { font-size: 12px; color: #aaaaaa; margin-bottom: 8px; }
.agent-meta { font-size: 11px; color: #888; margin-bottom: 8px; }
.agent-meta span { margin-right: 12px; }
.agent-actions { display: flex; gap: 8px; }
.btn {
  background: #3d3d3d;
  color: #e0e0e0;
  border: 1px solid #4d4d4d;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}
.btn:hover { background: #4d4d4d; }
.btn-primary { background: #007acc; border-color: #007acc; color: #fff; }
.btn-primary:hover { background: #0066b3; }
.btn-danger { background: #8a2c2c; border-color: #8a2c2c; color: #fff; }
.btn-danger:hover { background: #a03232; }
.empty { color: #888; font-style: italic; padding: 20px; text-align: center; }
.installed-badge { color: #4ec9b0; font-weight: bold; font-size: 11px; }
.not-installed-badge { color: #ff8888; font-size: 11px; }
</style>
</head>
<body>
<div class="header">
  <h1>Nebula Agent Manager</h1>
</div>
<div class="tabs">
  <div class="tab active" id="tab-installed">Agentes instalados</div>
  <div class="tab" id="tab-available">Explorar agentes disponibles</div>
</div>
<div class="content">
  <div class="panel" id="panel-installed">
    <h2>Agentes instalados</h2>
    <div id="installed-list"></div>
  </div>
  <div class="panel" id="panel-available" style="display:none;">
    <h2>Agentes disponibles</h2>
    <div class="empty">Fuentes de agentes disponibles: Hugging Face, Ollama, GitHub</div>
    <div id="available-list"></div>
  </div>
</div>

<script>
function postMessage(msg) {
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage(msg);
  } else if (window.webview) {
    window.webview.postMessage(msg);
  }
}

const tabInstalled = document.getElementById('tab-installed');
const tabAvailable = document.getElementById('tab-available');
const panelInstalled = document.getElementById('panel-installed');
const panelAvailable = document.getElementById('panel-available');
const installedList = document.getElementById('installed-list');

tabInstalled.addEventListener('click', () => {
  tabInstalled.classList.add('active');
  tabAvailable.classList.remove('active');
  panelInstalled.style.display = 'block';
  panelAvailable.style.display = 'none';
});
tabAvailable.addEventListener('click', () => {
  tabAvailable.classList.add('active');
  tabInstalled.classList.remove('active');
  panelAvailable.style.display = 'block';
  panelInstalled.style.display = 'none';
});

function renderInstalled(agents) {
  installedList.innerHTML = '';
  if (!agents || agents.length === 0) {
    installedList.innerHTML = '<div class="empty">No hay agentes instalados.</div>';
    return;
  }
  for (const agent of agents) {
    const card = document.createElement('div');
    card.className = 'agent-card';
    card.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <h3>${escapeHtml(agent.nombre || agent.name || 'Agente')}</h3>
          <p>${escapeHtml(agent.descripcion || agent.description || '')}</p>
          <div class="agent-meta">
            <span>v${escapeHtml(agent.version || '1.0.0')}</span>
            <span>${escapeHtml(agent.autor || agent.author || 'Desconocido')}</span>
            <span class="${agent.estado_instalacion === 'instalado' || agent.installed ? 'installed-badge' : 'not-installed-badge'}">
              ${agent.estado_instalacion === 'instalado' || agent.installed ? 'Instalado' : 'No instalado'}
            </span>
          </div>
        </div>
        <div class="agent-actions" style="display:flex; flex-direction:column; gap:6px;">
          <button class="btn btn-primary" onclick="agentAction('${escapeHtml(agent.nombre || agent.name)}', 'info')">Info</button>
          <button class="btn btn-danger" onclick="agentAction('${escapeHtml(agent.nombre || agent.name)}', 'uninstall')">Desinstalar</button>
        </div>
      </div>
    `;
    installedList.appendChild(card);
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function agentAction(name, action) {
  if (action === 'uninstall') {
    if (confirm('\u00bfDesinstalar el agente "' + name + '"?')) {
      postMessage('AGENT_UNINSTALL|' + name);
    }
  } else if (action === 'info') {
    postMessage('AGENT_INFO|' + name);
  }
}

function loadAgents() {
  postMessage('AGENT_LIST');
}

window.addEventListener('message', (e) => {
  const msg = e.data;
  if (typeof msg !== 'string') return;
  if (msg.startsWith('EVENT:AGENT_LIST|')) {
    const jsonStr = msg.substring(17);
    try {
      const agents = JSON.parse(jsonStr);
      renderInstalled(agents);
    } catch (e) {}
  }
}, false);

loadAgents();
</script>
</body>
</html>
